<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Karnataka Tourism Directory</title>
    <style>
        :root {
            --primary: #c2410c;
            --primary-dark: #9a3412;
            --primary-light: #fff7ed;
            --dark: #1f2937;
            --gray: #6b7280;
            --light-bg: #f9fafb;
            --white: #ffffff;
            --shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
            --radius: 12px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: var(--light-bg); color: var(--dark); line-height: 1.6; }

        header {
            background: linear-gradient(135deg, var(--primary-dark), var(--primary));
            color: var(--white);
            padding: 1rem 2rem;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .hero {
            background: linear-gradient(rgba(154, 52, 18, 0.85), rgba(194, 65, 12, 0.85)), url('https://images.unsplash.com/photo-1600100397608-f09070624022?auto=format&fit=crop&w=1200&q=80') center/cover;
            color: var(--white);
            text-align: center;
            padding: 3rem 1.5rem;
        }

        .search-box {
            max-width: 500px;
            margin: 1rem auto 0;
            background: var(--white);
            border-radius: 50px;
            padding: 4px;
        }

        .search-box input {
            width: 100%;
            border: none;
            padding: 0.8rem 1.5rem;
            font-size: 1rem;
            border-radius: 50px;
            outline: none;
        }

        .container { max-width: 1200px; margin: 2rem auto; padding: 0 1.5rem; }

        .filter-group { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 1.5rem; }

        .filter-btn {
            background: var(--white);
            border: 1px solid #e5e7eb;
            padding: 0.4rem 0.9rem;
            border-radius: 20px;
            cursor: pointer;
        }

        .filter-btn.active { background: var(--primary); color: var(--white); }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.5rem; }

        .card {
            background: var(--white);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
        }

        .card-img { height: 180px; width: 100%; object-fit: cover; }
        .card-body { padding: 1.25rem; flex: 1; display: flex; flex-direction: column; }
        .card-title { font-size: 1.2rem; font-weight: 700; }
        .card-desc { font-size: 0.9rem; color: var(--gray); margin: 0.5rem 0 1rem; flex: 1; }

        .card-btn {
            background: var(--primary);
            color: var(--white);
            border: none;
            padding: 0.6rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: 1000;
            padding: 1.5rem;
        }

        .modal-content {
            background: var(--white);
            max-width: 700px;
            margin: 2rem auto;
            border-radius: var(--radius);
            padding: 1.5rem;
            max-height: 85vh;
            overflow-y: auto;
        }

        .close-btn { float: right; font-size: 1.5rem; border: none; background: none; cursor: pointer; }
    </style>
    <!-- Load content dataset file -->
    <script src="data.js"></script>
</head>
<body>

    <header>
        <h2>🚩 Explore Karnataka Tourism</h2>
    </header>

    <div class="hero">
        <h1>Karnataka Districts Directory</h1>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Search by district or spot..." oninput="renderCards()">
        </div>
    </div>

    <div class="container">
        <div class="filter-group">
            <button class="filter-btn active" onclick="setFilter('all', this)">All</button>
            <button class="filter-btn" onclick="setFilter('Heritage', this)">Heritage</button>
            <button class="filter-btn" onclick="setFilter('Nature', this)">Nature</button>
            <button class="filter-btn" onclick="setFilter('Beach', this)">Beach</button>
        </div>

        <div class="grid" id="districtGrid"></div>
    </div>

    <div class="modal" id="detailsModal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeModal()">&times;</button>
            <h2 id="modalTitle"></h2>
            <p id="modalSubtitle" style="color: var(--gray);"></p>
            <img id="modalImg" style="width: 100%; height: 250px; object-fit: cover; border-radius: 8px; margin: 1rem 0;">
            <p id="modalDesc"></p>
            <p style="margin-top: 1rem;"><strong>Food:</strong> <span id="modalFood"></span></p>
            <a id="modalMapLink" href="#" target="_blank" style="display: inline-block; margin-top: 1rem; color: var(--primary); font-weight: bold;">View on Google Maps</a>
        </div>
    </div>

    <script>
        let activeCategory = 'all';

        function renderCards() {
            const grid = document.getElementById('districtGrid');
            const query = document.getElementById('searchInput').value.toLowerCase();

            const filtered = districts.filter(d => {
                const matchesCat = activeCategory === 'all' || d.category === activeCategory;
                const matchesSearch = d.name.toLowerCase().includes(query) || d.spot.toLowerCase().includes(query);
                return matchesCat && matchesSearch;
            });

            grid.innerHTML = filtered.map(item => `
                <div class="card">
                    <img src="${item.image}" alt="${item.spot}" class="card-img">
                    <div class="card-body">
                        <div class="card-title">${item.spot}</div>
                        <div style="font-size: 0.85rem; color: var(--gray);">${item.name} District</div>
                        <p class="card-desc">${item.shortDesc}</p>
                        <button class="card-btn" onclick="openModal('${item.id}')">Explore</button>
                    </div>
                </div>
            `).join('');
        }

        function setFilter(category, btn) {
            activeCategory = category;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderCards();
        }

        function openModal(id) {
            const item = districts.find(d => d.id === id);
            if (!item) return;

            document.getElementById('modalTitle').textContent = item.spot;
            document.getElementById('modalSubtitle').textContent = `${item.name} District • ${item.category}`;
            document.getElementById('modalImg').src = item.image;
            document.getElementById('modalDesc').textContent = item.overview;
            document.getElementById('modalFood').textContent = item.food;
            document.getElementById('modalMapLink').href = item.map;

            document.getElementById('detailsModal').style.display = 'block';
        }

        function closeModal() { document.getElementById('detailsModal').style.display = 'none'; }

        renderCards();
    </script>
</body>
</html>
